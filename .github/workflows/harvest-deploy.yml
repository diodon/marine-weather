# Harvest AODN + BOM data and publish the dashboard to GitHub Pages.
#
# No data is committed: the published site is the harvester's state. Each
# run reads the currently published data/*.json (to extend the BOM history
# and to fall back when an upstream fails), then deploys a fresh build.
#
# Repository settings → Pages → Source must be "GitHub Actions".

name: Harvest & deploy

on:
  schedule:
    - cron: "*/20 * * * *"   # GitHub may delay scheduled runs at busy times
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Harvest
        run: >
          uv run --project harvester harvest
          --config harvester/sources.yaml
          --out web/public/data
          --previous-url "${{ steps.pages.outputs.base_url }}/data"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
