# What the harvester collects and how the dashboard labels it.
#
# Every source becomes web/public/data/<id>.json; manifest.json lists them.
# `color` is the categorical slot (1-3) the dashboard uses for that source's
# map marker and chart lines — keep it fixed per source, never reassign.

title: Derwent Estuary · Blackmans Bay
center: {lon: 147.326, lat: -43.006, zoom: 10.6}   # Blackmans Bay, TAS
window_days: 30                                     # history kept per source

sources:
  - id: derwent_b1
    kind: aodn_parquet
    name: Derwent River B1
    description: IMOS estuarine & coastal water-quality mooring (EXO2 sonde, ~0.7 m)
    color: 1
    collection: mooring_estuarine_coastal_water_quality_monitoring_realtime_qc
    partition: {key: site_code, value: TAS-DERWENT-RIVER-B1}
    qc: {mode: per_variable}            # <VAR>_quality_control: 1 pass, 2 not evaluated, 3 questionable, 4 fail, 9 missing
    stale_after_hours: 3
    link: https://portal.aodn.org.au/
    # Variables of interest agreed for the Derwent site. FLUSI (FLU690/FLU670
    # ratio) is listed but not yet present in the live product's files — the
    # harvester skips columns a file doesn't carry, so it appears once it does.
    variables:
      TEMP:  {label: Water temperature,  units: °C,    digits: 2, default: true}
      PSAL:  {label: Salinity,           units: PSU,   digits: 2, default: true}
      DOXS:  {label: Oxygen saturation,  units: '%',   digits: 1, default: true}
      CPHL:  {label: Chlorophyll-a,      units: mg/m³, digits: 2, default: true}
      TURB:  {label: Turbidity,          units: FNU,   digits: 1}
      FDOM:  {label: fDOM,               units: QSU,   digits: 2}
      PHYCO: {label: Phycoerythrin,      units: mg/m³, digits: 2}
      FLUSI: {label: Fluorescence spectral shift index, units: '', digits: 3}

  - id: storm_bay_wave
    kind: aodn_parquet
    name: Storm Bay wave buoy
    description: IMOS / UTAS coastal wave buoy, real-time (non-QC'd) parameters
    color: 2
    collection: wave_buoy_realtime_nonqc
    # Two partitions exist for this buoy; "Storm%20Bay" is a stale 2025 duplicate.
    partition: {key: site_name, value: STORM-BAY}
    qc: {mode: single, column: WAVE_quality_control}   # 1 good, 2 not evaluated, 3 questionable, 4 bad, 9 missing
    stale_after_hours: 4
    link: https://portal.aodn.org.au/
    variables:
      WSSH:  {label: Significant wave height, units: m,  digits: 2, default: true}
      WPPE:  {label: Peak wave period,        units: s,  digits: 1, default: true}
      WPFM:  {label: Mean wave period,        units: s,  digits: 1}
      SSWMD: {label: Mean wave direction,     units: °,  digits: 0, direction: true, default: true}
      WPDI:  {label: Peak wave direction,     units: °,  digits: 0, direction: true}
      WMDS:  {label: Mean directional spread, units: °,  digits: 0}

  - id: bom_dennes_point
    kind: bom_obs
    name: Dennes Point (BOM)
    description: Bureau of Meteorology AWS 094255, north Bruny Island — closest station to Blackmans Bay (~7 km)
    color: 3
    product: IDT60920    # Tasmania latest observations, BOM anonymous FTP (position comes from the feed)
    wmo: 94988
    stale_after_hours: 2
    link: https://www.bom.gov.au/products/IDT60801/IDT60801.94988.shtml
    # Keys are the feed's <element type="..."> names.
    variables:
      wind_spd:        {label: Wind speed,        units: kn,  digits: 0, default: true}
      wind_gust_spd:   {label: Wind gust,         units: kn,  digits: 0, default: true}
      wind_dir_deg:    {label: Wind direction,    units: °,   digits: 0, direction: true, default: true}
      air_temperature: {label: Air temperature,   units: °C,  digits: 1, default: true}
      apparent_temp:   {label: Feels like,        units: °C,  digits: 1}
      rel-humidity:    {label: Relative humidity, units: '%', digits: 0}
      msl_pres:        {label: Pressure (MSL),    units: hPa, digits: 1, default: true}
      rainfall:        {label: Rain since 9 am,   units: mm,  digits: 1}
